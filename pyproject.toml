[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-agent"
version = "0.1.0"
description = "Business Analyst interview agent — LangChain (no LangGraph) + LM Studio + FastAPI web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ba-agent = "ba_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ba_agent = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# If a test ever blocks, dump all thread stacks to the log instead of hanging silently.
faulthandler_timeout = 60
