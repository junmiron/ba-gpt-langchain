[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-agent"
version = "1.0.0"
description = "Business Analyst interview agent — LangChain (no LangGraph) + LM Studio + FastAPI web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "langchain-core>=1.7",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.1",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "lxml>=5.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# PDF engines. Typst is a vendored/system binary (no pip package); ReportLab is the pure-Python fallback.
pdf = ["reportlab>=4.0", "svglib>=1.3", "weasyprint>=62"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.12",
    "reportlab>=4.0",
    "svglib>=1.3",
]

[project.scripts]
ba-agent = "ba_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ba_agent = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# If a test ever blocks, dump all thread stacks to the log instead of hanging silently.
faulthandler_timeout = 60
# `live` tests talk to a real model server. They are excluded from the default run so the
# suite stays deterministic and fast offline; opt in with: pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: requires a reachable model server (skipped from the default run)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
# BLE001 stays selected so the `# noqa: BLE001` markers on deliberate broad excepts stay meaningful.
ignore = ["B008", "SIM108", "RUF001", "RUF012", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
