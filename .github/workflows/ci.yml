name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Offline by design: the only network access is pip fetching packages. No model, no LM Studio, no
      # external URLs are contacted by the test suite. `pyproject.toml` carries `addopts = "-m 'not live'"`,
      # so the live provider smoke tests are deselected here. Typst is absent in CI, so the PDF tests
      # exercise the ReportLab fallback and skip the Typst path.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type check
        run: mypy src

      # Every declared config key must be read somewhere, and config.yaml must not drift from the
      # code defaults. Both have bitten this project.
      - name: Config audit
        run: python scripts/config_audit.py

      - name: Frontend syntax check
        run: node --check src/ba_agent/web/app.js

      - name: Test
        run: pytest -q

      # The pipeline is only "working" if it produces a real, QA-passing deliverable end to end. Unit tests
      # can all pass while the export path is broken, so the offline acceptance run is a separate gate.
      - name: Offline acceptance (no model)
        run: python scripts/e2e_offline.py
